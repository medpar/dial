name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/dial
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd macos && swift build -c release
